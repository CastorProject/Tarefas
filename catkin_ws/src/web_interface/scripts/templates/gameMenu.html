<!DOCTYPE html>
  <head>
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap.min.css') }}">
    <script src="{{ url_for('static', filename='jquery.min.js') }}"></script>
    <script src="{{ url_for('static', filename='bootstrap.min.js') }}"></script>
    <style>
      body
      {
        width: 800px;
        margin: 0 auto;
        background-color: white;
        padding: 0 20px 20px 20px;
        border: 3px solid black;
        font-family: "Gill Sans Extrabold", Helvetica, sans-serif;
      }

      h1
      {
        font-size: 50px;
        text-align: center;
      }

      p
      {
        text-align: center;
      }


      .button
      {
        background:transparent;
        border: 1px solid transparent;
        box-sizing: border-box;
        cursor: pointer;
        font-size: 20px;
        font-weight: 700;
        line-height: 1;
        margin: 10px;
        padding: 5px 15px;
        text-align: center;
        text-decoration: none;
        display:inline-block;
        outline:none;
        position:relative;
        top:0;
        text-shadow:0 1px 1px rgba(0, 0, 0, 0.5);
        -webkit-transition: all 0.2s ease-in-out 0s;
        -moz-transition: all 0.2s ease-in-out 0s;
        -ms-transition: all 0.2s ease-in-out 0s;
        transition: all 0.2s ease-in-out 0s;
      }

      .grey
      {
        background:#4c4c4c;
        color:#fff;
        box-shadow: 0 2px 0 #333333;
      }

      .grey:hover
      {
        background:#747373;
      }

      .grey:active, .grey:focus
      {
        background:#444444;
      }
    </style>
  </head>
  <body>
    <h1>Jogos</h1>
    <p>
    <div class="btn-group">
      <div class="btn-group">
        <button style="width: 350px;" class="btn btn-default btn-lg dropdown-toggle" type="button" data-toggle="dropdown">Jogo 1 - Atenção ativa
          <span class="caret"></span></button>
          <ul class="dropdown-menu">
            <li><a href="/game_atac?level=basic">Nível básico</a></li>
            <li><a href="/game_atac?level=advanced">Nível avançado</a></li>
          </ul>
      </div>
      <div class="btn-group">
        <button style="width: 350px;" class="btn btn-default btn-lg dropdown-toggle" type="button" data-toggle="dropdown">Jogo 2 - Guardiões
          <span class="caret"></span></button>
          <ul class="dropdown-menu">
            <li><a href="/game_guardianes?level=basic">Nível básico</a></li>
            <li><a href="/game_guardianes?level=advanced">Nível avançado</a></li>
          </ul>
      </div>
    </div>
  </p>
  <p>
    <div class="btn-group">
      <div class="btn-group">
        <button style="width: 350px;" class="btn btn-default btn-lg dropdown-toggle" type="button" data-toggle="dropdown">Jogo 3 - Memória mágica
          <span class="caret"></span></button>
          <ul class="dropdown-menu">
            <li><a href="/game_memoriamagic?level=basic">Nível básico</a></li>
            <li><a href="/game_memoriamagic?level=advanced">Nível avançado</a></li>
          </ul>
      </div>
      <a style="width: 350px;" class="btn btn-default btn-lg dropdown-toggle" type="button" href="/game_planificar">Jogo 4 - Planejamento de festa</a>
    </div>
     </p>
  <p>
    <div class="btn-group">
      <div class="btn-group">
        <a style="width: 350px;" class="btn btn-default btn-lg dropdown-toggle" type="button" href="/game_RPS">Jogo 5 - Pedra, Papel e Tesoura</a>
      </div>
      
    </div>
    </p>
    <p>
    </p>
    <a class="btn btn-default btn-lg " href="/">Menu</a>
  </body>
</html>
