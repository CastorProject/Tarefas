<!DOCTYPE html>
<html lang="pt-br">

<head>

    <title>{{ title }}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap.min.css') }}">

    <script src="{{ url_for('static', filename='jquery-3.5.1.min.js') }}"></script>
    <script src="{{ url_for('static', filename='bootstrap.min.js') }}"></script>

    <style>

        body{
            width:900px;
            margin:30px auto;
            padding:20px;
            background:#ffffff;
            border:3px solid #000;
            font-family:Arial, Helvetica, sans-serif;
        }

        h1{
            text-align:center;
            margin-bottom:30px;
        }

        #camera-area{
            border:2px dashed #999;
            border-radius:10px;
            background:#f8f8f8;
            padding:30px;
            text-align:center;
            margin-bottom:40px;
        }

        #result-area{
            display:flex;
            justify-content:space-evenly;
            align-items:flex-start;
            margin-top:30px;
        }

        .choice{
            text-align:center;
        }

        .choice-box{
            width:180px;
            height:180px;
            border:3px solid #444;
            border-radius:12px;
            background:#fff;
            display:flex;
            justify-content:center;
            align-items:center;
            margin:auto;
            box-shadow:0 2px 10px rgba(0,0,0,.2);
        }

        .choice-box img{
            max-width:140px;
            max-height:140px;
        }

        #status{
            font-size:22px;
        }

        .simple-button{
            background:white;
            display:inline-block;
            text-align:center;
            color:black;
            border:2px solid black;
            padding:10px 25px;
            font-size:18px;
            cursor:pointer;
            margin:5px;
        }

        .simple-button:hover{
            background:#f2f2f2;
        }

    </style>

</head>

<body>

    <h1>Pedra, Papel e Tesoura</h1>

    <div id="camera-area">

        <h2 id="status">Clique em Jogar para começar</h2>

        <p id="instruction">Clique em Jogar para começar.</p>

    </div>

    <div id="result-area">

        <div class="choice">

            <h3>Sua jogada</h3>

            <div class="choice-box">
                <img id="playerChoice"
                     src="{{ url_for('static', filename='images/objects/rps.png') }}">
            </div>

        </div>

        <div class="choice">

            <h3>CASTOR</h3>

            <div class="choice-box">
                <img id="computerChoice"
                     src="{{ url_for('static', filename='images/objects/rps.png') }}">
            </div>

        </div>

    </div>

    <div style="text-align:center; margin-top:40px;">

        <button id="mainButton" class="simple-button" onclick="startGame()">
            Jogar
        </button>

        <a href="/game_menu" class="simple-button" style="text-decoration:none;">
            Voltar
        </a>

    </div>

<script>

let waitingResponse = false;

function startGame() {

    if (waitingResponse)
        return;

    waitingResponse = true;

    $("#status").text("Reconhecendo jogada...");
    $("#instruction").text("Mostre Pedra, Papel ou Tesoura para a câmera.");

    $.ajax({

        url: "/play",
        type: "POST",
        dataType: "json",

        success: function(data) {

            waitingResponse = false;

            let result = data.result.trim();

            console.log(data);

            if (result === "TIMEOUT") {
                $("#status").text("Nenhuma jogada detectada.");
                $("#instruction").text("Clique em Jogar novamente.");
                return;
            }

            if (result === "CAMERA_OFFLINE") {
                $("#status").text("Câmera desconectada.");
                $("#instruction").text("Clique em Jogar novamente.");
                return;
            }

            if (result === "ERROR") {
                $("#status").text("Erro: " + data.message);
                $("#instruction").text("Clique em Jogar novamente.");
                return;
            }

            $("#playerChoice").attr(
                "src",
                "/static/images/objects/" + data.player.toLowerCase() + ".png"
            );

            $("#computerChoice").attr(
                "src",
                "/static/images/objects/" + data.computer.toLowerCase() + ".png"
            );

            if (result === "VENCEU") {

                $("#status").text("🏆 Você venceu!");

            }
            else if (result === "PERDEU") {

                $("#status").text("😢 Você perdeu!");

            }
            else {

                $("#status").text("🤝 Empate!");

            }

            $("#instruction").text("Clique em Jogar novamente para iniciar uma nova rodada.");

            $("#mainButton").text("Jogar novamente");

        },

        error: function(xhr, status, error) {

            waitingResponse = false;

            console.log(xhr);
            console.log(status);
            console.log(error);

            $("#status").text("Erro ao comunicar com o servidor.");
            $("#instruction").text("Clique em Jogar novamente.");

        }

    });

}

</script>

</body>

</html>
