<!DOCTYPE html>
<html>
<head>
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap.min.css') }}">
    <script src="{{ url_for('static', filename='jquery-3.5.1.min.js') }}"></script>
    <script src="{{ url_for('static', filename='jquery.min.js') }}"></script>
    <script src="{{ url_for('static', filename='bootstrap.min.js') }}"></script>
    <style>
        body 
        {
            width: 800px;
            margin: 0 auto;
            background-color: white;
            padding: 0 20px 20px 20px;
            border: 3px solid black;
            font-family: "Gill Sans Extrabold", Helvetica, sans-serif;
        }

        h1 {
            font-size: 50px;
        }

        p {
            text-align: center;
        }

        .button {
            background: transparent;
            border: 1px solid transparent;
            box-sizing: border-box;
            cursor: pointer;
            font-size: 20px;
            font-weight: 700;
            line-height: 1;
            margin: 10px;
            padding: 2px 10px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            outline: none;
            position: relative;
            top: 0;
            text-shadow: 0 1px 1px rgba(0, 0, 0, 0.5);
            transition: all 0.2s ease-in-out 0s;
        }

        .grey {
            background: #4c4c4c;
            color: #fff;
            box-shadow: 0 2px 0 #333333;
        }

        .grey:hover {
            background: #747373;
        }

        .grey:active, .grey:focus {
            background: #444444;
        }
    </style>
</head>
<body>
    <h1>Selecione as atividades de hoje</h1>
    <div id="buttons-container" class="d-flex flex-wrap justify-content-center">
        <p>
            <button style="width: 310px;" class="btn btn-default btn-lg m-2 select-btn" data-item="Atividade 1 - A batalha 👮‍♂️">Atividade 1 - A batalha 👮‍♂️</button>
            <button style="width: 310px;" class="btn btn-default btn-lg m-2 select-btn" data-item="Atividade 2 - Histórias de José 👦">Atividade 2 - Histórias de José 👦</button>
        </p>
        <p>    
            <button style="width: 310px;" class="btn btn-default btn-lg m-2 select-btn" data-item="Atividade 3 - Dança 💃">Atividade 3 - Dança 💃</button>
            <button style="width: 310px;" class="btn btn-default btn-lg m-2 select-btn" data-item="Atividade 4 - Cantar 🎵">Atividade 4 - Cantar 🎵</button>
        </p>
        <p>
            <button style="width: 310px;" class="btn btn-default btn-lg m-2 select-btn" data-item="Atividade 5 - Histórias narrativas 📢">Atividade 5 - Histórias narrativas 📢</button>
            <button style="width: 310px;" class="btn btn-default btn-lg m-2 select-btn" data-item="Atividade 6 - Conversação 🤪">Atividade 6 - Conversação 🤪</button>
        </p>
        <p>
        <button class="btn btn-default btn-lg m-2 select-btn" data-item="Atividade 7 - Abraços 💕">Atividade 7 - Abraços 💕</button>
        </p>
    </div>
    <h2>Atividades</h2>
    <ul id="selected-items" class="list-group btn-lg">
    </ul>
    <div id="activities-container"></div>
    <div style="text-align: right;"><button id="start-button" class="btn btn-default btn-lg">Começar</button></div>
    </form>
    <!-- Modal -->
    <div id="Alarms" class="modal fade" role="dialog">
        <div class="modal-dialog">
          <!-- Modal content-->
          <div class="modal-content">
            <div class="modal-header">
              <button type="button" class="close" data-dismiss="modal">&times;</button>
              <h4 class="modal-title">Atividades</h4>
            </div>
            <div class="modal-body">
              <span id="modal-messages"></span>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-default" href='/Pseudoprogramacion' data-dismiss="modal">Ok</button>
            </div>
          </div>
        </div>
      </div>
    <a class="btn btn-default btn-lg" href="/">Menu</a>
    <script src="static/script.js"></script>
</body>
</html>
