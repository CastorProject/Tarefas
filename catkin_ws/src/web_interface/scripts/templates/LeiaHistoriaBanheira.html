<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>{{ title }}</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap.min.css') }}">
  <script src="{{ url_for('static', filename='jquery.min.js') }}"></script>
  <script src="{{ url_for('static', filename='bootstrap.min.js') }}"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body
    {
      min-height: 100%;
    }

    body
    {
      width: 800px;
      max-width: 96vw;
      margin: 0 auto;
      background-color: white;
      padding: 8px 16px 10px 16px;
      border: 3px solid black;
      font-family: "Gill Sans Extrabold", Helvetica, sans-serif;
    }

    h1
    {
      font-size: 40px;
      text-align: center;
      margin: 6px 0 8px 0;
    }

    p
    {
      text-align: center;
      margin: 5px 0;
    }

    .imagem-historia
    {
      display: block;
      max-width: 100%;
      width: auto;
      max-height: 55vh;
      height: auto;
      object-fit: contain;
      margin: 6px auto 8px auto;
      border: 2px solid #ccc;
      border-radius: 8px;
    }

    .feedback-leitura
    {
      max-width: 750px;
      margin: 7px auto;
      padding: 7px 14px;
      background-color: #f7f8fa;
      border: 2px solid #d9dfe5;
      border-radius: 10px;
      text-align: center;
    }

    .feedback-titulo
    {
      font-size: 15px;
      font-weight: bold;
      color: #555;
      margin-bottom: 3px;
    }

    .frase-feedback
    {
      font-size: 21px;
      font-weight: 600;
      line-height: 1.3;
      min-height: 28px;
    }

    .palavra
    {
      display: inline-block;
      margin: 0 2px;
      transition: color 0.2s;
    }

    .palavra-correta
    {
      color: #159447;
    }

    .palavra-errada
    {
      color: #d32f2f;
    }

    .porcentagem-feedback
    {
      margin-top: 3px;
      font-size: 16px;
      font-weight: bold;
      color: #444;
      min-height: 20px;
    }

    .btn
    {
      margin: 2px;
    }

    @media (max-height: 750px)
    {
      h1
      {
        font-size: 34px;
        margin: 4px 0 6px 0;
      }

      .imagem-historia
      {
        max-height: 50vh;
      }

      .feedback-leitura
      {
        padding: 5px 12px;
        margin: 5px auto;
      }

      .frase-feedback
      {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

  <h1>Leitura 📚</h1>

  <p>
    <img
      class="imagem-historia"
      src="{{ url_for('static', filename='images/ReadmeHistory/img1.png') }}"
      alt="Imagem da história">
  </p>

  <div class="feedback-leitura">
    <div class="feedback-titulo">Reconhecido:</div>

    <div id="frase-feedback" class="frase-feedback">
      Aguardando leitura...
    </div>

    <div id="porcentagem-feedback" class="porcentagem-feedback"></div>
  </div>

  <p>
    <a class="btn btn-default btn-lg" href="/Activities">
      Voltar
    </a>

    <a class="btn btn-default btn-lg" href="/Activities/A8/banheira/pagina2">
      Proximo
    </a>

    <a class="btn btn-default btn-lg" href="/">
      Menu
    </a>
  </p>

  <script>
    let mudandoPagina = false;

    function mostrarFeedback(data) {
      const frase = document.getElementById("frase-feedback");
      const porcentagem = document.getElementById("porcentagem-feedback");

      frase.innerHTML = "";

      // Enquanto nenhuma frase chegou em /microphone.
      if (data.heard === "") {
        frase.textContent = "Aguardando leitura...";
        porcentagem.textContent = "";
        return;
      }

      // Exibe exatamente a saída reconhecida pelo microfone.
      data.feedback.forEach(function(item) {
        const palavra = document.createElement("span");

        palavra.textContent = item.word;
        palavra.classList.add("palavra");

        if (item.correct) {
          palavra.classList.add("palavra-correta");
        }
        else {
          palavra.classList.add("palavra-errada");
        }

        frase.appendChild(palavra);
        frase.appendChild(document.createTextNode(" "));
      });

      porcentagem.textContent =
        "Acerto: " + data.percentage + "%";
    }

    const verificarLeitura = setInterval(function() {
      fetch('/Activities/A8/banheira/verificar/1')
        .then(response => response.json())
        .then(data => {
          mostrarFeedback(data);

          if (data.success && !mudandoPagina) {
            mudandoPagina = true;
            clearInterval(verificarLeitura);

            setTimeout(function() {
              window.location.href = "/Activities/A8/banheira/pagina2";
            }, 1800);
          }
        })
        .catch(error => {
          console.log("Erro ao verificar leitura:", error);
        });
    }, 250);
  </script>

</body>
</html>
