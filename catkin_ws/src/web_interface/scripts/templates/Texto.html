<!DOCTYPE html>
<html>
<head>
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap.min.css') }}">
    <script src="{{ url_for('static', filename='jquery.min.js') }}"></script>
    <script src="{{ url_for('static', filename='bootstrap.min.js') }}"></script>
    <script>
        function fetchText() {
            fetch('/get_text')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('dynamic-text').innerText = data.text;
                })
                .catch(error => console.error('Error fetching text:', error));
        }

        setInterval(fetchText, 1000);  // Fetch text every 1 second
    </script>
    <style>
        body 
        {
            width: 800px;
            margin: 0 auto;
            background-color: white;
            padding: 0 20px 20px 20px;
            border: 3px solid black;
            font-family: "Gill Sans Extrabold", Helvetica, sans-serif;
        }

        h1 {
            font-size: 50px;
        }

        p {
            text-align: center;
        }

        .button {
            background: transparent;
            border: 1px solid transparent;
            box-sizing: border-box;
            cursor: pointer;
            font-size: 20px;
            font-weight: 700;
            line-height: 1;
            margin: 10px;
            padding: 5px 15px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            outline: none;
            position: relative;
            top: 0;
            text-shadow: 0 1px 1px rgba(0, 0, 0, 0.5);
            transition: all 0.2s ease-in-out 0s;
        }

        .grey {
            background: #4c4c4c;
            color: #fff;
            box-shadow: 0 2px 0 #333333;
        }

        .grey:hover {
            background: #747373;
        }

        .grey:active, .grey:focus {
            background: #444444;
        }
    </style>
</head>
<body>
    <div class="container">
    <h1>Olá, escreva algo para começar...</h1>
    <form id="inputForm">
        <div class="form-group row">
            <div class="col-xs-4">
                <input class="form-control" id="ex3" name="input_text" type="text" placeholder="Olá, CASTOR">
            </div>
        </div>
        <div class="form-group">        
            <div class="col-sm-offset-2 col-sm-10">
                <button type="submit" class="btn btn-default">Enviar</button>
            </div>
        </div>
    </form>
    </div>

    <h2 id="dynamic-text">Olá...</h2>
            
    <a class="btn btn-default btn-lg" href="/">Menu</a>
    <script src="{{ url_for('static', filename='jquery-3.5.1.min.js') }}"></script>
    <script src="static\script.js"></script>
</body>
</html>
