<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='activity9.css') }}?v=3">
</head>
<body>
<main class="game">
  <p class="eyebrow">ATIVIDADE 9 CONCLUÍDA</p>
  <h1>{{ {'win': 'Você ganhou!', 'draw': 'Nós empatamos!', 'loss': 'Obrigado por jogar!'}[game.outcome] }}</h1>
  <span class="hero-emoji" aria-hidden="true">🏆</span>
  <div class="results">
    <section class="result-card"><h2>Você</h2><strong>⭐ {{ game.score }} / {{ chances }}</strong><p>emoções adivinhadas</p></section>
    <section class="result-card"><h2>CASTOR</h2><strong>⭐ {{ game.castor_score }} / {{ chances }}</strong><p>emoções adivinhadas</p></section>
  </div>
  <p class="prompt">{{ game.result_message }}</p>
  <form method="post" action="{{ url_for('a9.sair') }}">
    <button class="action" type="submit">Voltar às atividades</button>
  </form>
</main>
</body>
</html>
