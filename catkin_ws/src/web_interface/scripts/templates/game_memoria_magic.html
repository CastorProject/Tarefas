<!DOCTYPE html>
<html lang="es">
<head>
    <title>{{ title }}</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap.min.css') }}">
        <script src="{{ url_for('static', filename='jquery-3.5.1.min.js') }}"></script>
        <script src="{{ url_for('static', filename='jquery.min.js') }}"></script>
        <script src="{{ url_for('static', filename='bootstrap.min.js') }}"></script>
        <style>
            body 
            {
                width: 800px;
                margin: 0 auto;
                background-color: white;
                padding: 0 20px 20px 20px;
                border: 3px solid black;
                font-family: "Gill Sans Extrabold", Helvetica, sans-serif;
            }
    
            h1 {
                font-size: 50px;
            }
    
            p {
                text-align: center;
            }
    
            .button {
                background: transparent;
                border: 1px solid transparent;
                box-sizing: border-box;
                cursor: pointer;
                font-size: 20px;
                font-weight: 700;
                line-height: 1;
                margin: 10px;
                padding: 2px 10px;
                text-align: center;
                text-decoration: none;
                display: inline-block;
                outline: none;
                position: relative;
                top: 0;
                text-shadow: 0 1px 1px rgba(0, 0, 0, 0.5);
                transition: all 0.2s ease-in-out 0s;
            }
    
            .grey {
                background: #4c4c4c;
                color: #fff;
                box-shadow: 0 2px 0 #333333;
            }
    
            .grey:hover {
                background: #747373;
            }
    
            .grey:active, .grey:focus {
                background: #444444;
            }
        </style>
</head>
<body>
    <div class="game-container">
        <h1>Memória mágica</h1>
        <div class="grid" id="grid">
            <p>
            <form action="/game_memoriamagic" method="POST">
                <input type="hidden" name="action" value="button_pressed">
                <input type="hidden" name="level" value="{{ level }}">
                <button type="submit" class="btn btn-default btn-lg" style="width: 350px;">Como Jogar?</button>
            </form>
            </p>
            <!-- Las cartas se generarán aquí -->
        </div>
        <p></p>
        <button style="width: 350px;" class="btn btn-default btn-lg" id="startButton">Iniciar Jogo</button>
        <a style="width: 350px;" href="/game_menu" class="btn btn-default btn-lg">Voltar</a>
        <p id="message"></p>
    </div>
    <script src="{{ url_for('static', filename='game_3.js') }}"></script>
</body>
</html>
