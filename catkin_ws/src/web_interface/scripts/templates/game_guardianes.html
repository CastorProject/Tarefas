<!DOCTYPE html>
<html lang="en">
<head>
  <title>{{ title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap.min.css') }}">
  <script src="{{ url_for('static', filename='jquery-3.5.1.min.js') }}"></script>
  <script src="{{ url_for('static', filename='jquery.min.js') }}"></script>
  <script src="{{ url_for('static', filename='bootstrap.min.js') }}"></script>
    <style>
      body
      {
        width: 1000px;
        margin: 0 auto;
        background-color: white;
        padding: 0 20px 20px 20px;
        border: 3px solid black;
        font-family: "Gill Sans Extrabold", Helvetica, sans-serif;
      }

      h1
      {
        font-size: 50px;
        text-align: center;
      }

      p
      {
        text-align: center;
      }


      .button
      {
        background:transparent;
        border: 1px solid transparent;
        box-sizing: border-box;
        cursor: pointer;
        font-size: 20px;
        font-weight: 700;
        line-height: 1;
        margin: 10px;
        padding: 5px 15px;
        text-align: center;
        text-decoration: none;
        display:inline-block;
        outline:none;
        position:relative;
        top:0;
        text-shadow:0 1px 1px rgba(0, 0, 0, 0.5);
        -webkit-transition: all 0.2s ease-in-out 0s;
        -moz-transition: all 0.2s ease-in-out 0s;
        -ms-transition: all 0.2s ease-in-out 0s;
        transition: all 0.2s ease-in-out 0s;
      }

      .grey
      {
        background:#4c4c4c;
        color:#fff;
        box-shadow: 0 2px 0 #333333;
      }

      .grey:hover
      {
        background:#747373;
      }

      .grey:active, .grey:focus
      {
        background:#444444;
      }
    </style>
</head>
<body>
    <p>
    <div id="game-container">
        <h1>Guardiões da atenção</h1>
        <form action="/game_guardianes" method="POST">
          <input type="hidden" name="action" value="button_pressed">
          <input type="hidden" name="level" value="{{ level }}">
          <button type="submit" class="btn btn-default btn-lg">Como Jogar?</button>
        </form>
        <p></p>
        <canvas id="gameCanvas"></canvas>
        <div id="feedback"></div>
        <div id="time-remaining">
          <p>Tempo restante: <span id="time">60</span> segundos</p>
        </div>
        <p>
        <div id="controls">
          <button class="btn btn-default btn-lg " id="leftButton">Esquerda</button>
          <button class="btn btn-default btn-lg " id="rightButton">Direita</button>
        </div>
        </p>
        <p>
        <button class="btn btn-default btn-lg " id="startButton">Iniciar Jogo</button>
        </p>
    </div>
    </p>
    <p>
      <button class="btn btn-default btn-lg" id="pauseButton">Pausar</button>
      <button class="btn btn-default btn-lg" id="resumeButton" style="display:none;">Seguir</button>
    </p>
    <p>
    <a class="btn btn-default btn-lg " href="/">Menu</a>
    </p>
    <!-- Modal -->
    <div id="timeUpModal" class="modal fade" role="dialog">
      <div class="modal-dialog">
        <!-- Modal content-->
        <div class="modal-content">
          <div class="modal-header">
            <button type="button" class="close" data-dismiss="modal">&times;</button>
            <h4 class="modal-title">Jogos</h4>
          </div>
          <div class="modal-body">
            <p>O tempo acabou! Placar final: <span id="scoreDisplay"></span></p></p>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-default" id="goToResults" data-dismiss="modal">Ok</button>
          </div>
        </div>
      </div>
    </div>
    <script src="{{ url_for('static', filename='game_2.js') }}"></script>
</body>
</html>
