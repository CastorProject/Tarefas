<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='activity9.css') }}">
</head>
<body>
<main class="game">
  <p class="eyebrow">ATIVIDADE 9</p>
  <h1>Vamos adivinhar emoções!</h1>
  <span class="hero-emoji" aria-hidden="true">🤖 🎭</span>
  <p class="explanation">{{ explanation }}</p>
  <p class="prompt">10 rodadas · 5 chances para você · 5 chances para o CASTOR</p>
  <div class="actions">
    <form method="post" action="{{ url_for('a9.iniciar') }}">
      <button class="action" type="submit">Vamos jogar! ⭐</button>
    </form>
    <a class="action secondary" href="{{ url_for('a9.explicar') }}">Ouvir novamente 🔊</a>
  </div>
  <form class="exit" method="post" action="{{ url_for('a9.sair') }}">
    <button type="submit">Voltar às atividades</button>
  </form>
</main>
</body>
</html>
